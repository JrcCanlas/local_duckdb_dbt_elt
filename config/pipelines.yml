# Each pipeline describes one source-to-mart flow. Set enabled to false to skip it.
pipelines:
  sales:
    # This example is ready for configuration but disabled until sales model exist.
    enabled: false
    source_folder: source/sales
    source_patter: "*.xlsx"
    bronze_table: bronze.sales
    dbt_selector: tag:sales
    mart_tables:
      - mart.sales

  erp:
    enabled: true
    append: true
    # Source files are discovered relative to the repository unit
    source_folder: source/erp
    source_pattern: "*.csv"
    bronze_table: bronze.erp
    # excel:
    # sheet_name: "ERP_RAW"
    # header: 0
    required_columns:
    # The selector chooses the dbt models
    dbt_selector: tag:erp
    mart_tables:
      - mart.erp

  workflow:
    enabled: true
    append: true
    # Source files are discovered relative to the repository root.
    source_folder: source/workflow
    source_pattern: "*.csv"
    bronze_table: bronze.workflow
    required_columns:
    dbt_selector: +tag:workflow
    mart_tables:
      - mart.workflow

  customer:
    enabled: false
    append: false
    # Source files are discovered relative to the repository root.
    source_folder: source/customer
    source_pattern: "*.csv"
    bronze_table: bronze.customer
    required_columns:

    # The selector chooses the dbt models tagged for this pipeline.
    dbt_selector: tag:customer
    mart_tables:
      - mart.customer
