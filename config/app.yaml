# Path are relative to the repository root, where main.py is run.
database: database/etl.duckdb
logging:
  # INFO writes progress to both console and logs/etl.log.
  level: INFO
  file: logs/elt.log
exports:
  # Parquet is the default formart consumed by Power BI.
  parquet: true
  csv: false
  folder: exports/powerbi
